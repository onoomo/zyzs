name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不使用 android-actions/setup-android：该 action 会尝试安装已被移除的旧包
      # "tools"，在 cmdline-tools 16.0 的 runner 上必然失败。runner 镜像已自带 SDK。
      - name: 配置 Android SDK 并安装 API 36 构建组件
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(command -v sdkmanager || true); fi
          if [ -z "$SDKMGR" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "sdkmanager = $SDKMGR"
          echo "ANDROID_HOME=$ANDROID_HOME"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMGR")"          >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "=== 已安装的关键组件 ==="
          "$SDKMGR" --list_installed | grep -E "platforms;android-36|build-tools;36\.0\.0|platform-tools" || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveTwoBox-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
